<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TypeCraft · Master Your Keystrokes</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<nav>
  <div class="logo" onclick="navigateTo('test')">⌨ Type<span>Craft</span></div>
  <div class="nav-links">
    <button class="nav-btn active" id="navTestBtn" onclick="navigateTo('test')">test</button>
    <button class="nav-btn" id="navProfileBtn" style="display:none" onclick="navigateTo('profile')">profile</button>
    <button class="nav-btn" onclick="showToast('🏆 coming soon')">leaderboard</button>
    <button class="nav-btn" onclick="toggleSettings()">settings</button>
    <div id="authButtons" style="display:flex;gap:5px">
      <button class="nav-btn" onclick="openModal('login')">log in</button>
      <button class="nav-btn" style="color:var(--accent)" onclick="openModal('register')">register</button>
    </div>
    <button class="avatar-btn" id="avatarToggle" style="display:none" onclick="toggleDropdown()"></button>
  </div>
</nav>

<div class="profile-dropdown" id="profileDropdown">
  <div class="pd-header">
    <div class="pd-name" id="dropdownName">—</div>
    <div class="pd-email" id="dropdownEmail">—</div>
  </div>
  <button class="pd-item" onclick="navigateTo('profile');closeDropdown()">👤 My Profile</button>
  <button class="pd-item" onclick="navigateTo('test');closeDropdown()">⌨ Typing Test</button>
  <button class="pd-item danger" onclick="logout()">↠ Log out</button>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="loginModal"><div class="modal"><button class="modal-close" onclick="closeModal('login')">×</button><div class="modal-title">welcome back</div><div class="modal-sub">track your speed & accuracy</div><div class="field"><label>Email</label><input id="loginEmail" type="email"><div class="field-error" id="loginEmailErr"></div></div><div class="field"><label>Password</label><input id="loginPassword" type="password"><div class="field-error" id="loginPassErr"></div></div><button class="primary-btn" onclick="doLogin()">Log In</button><div class="modal-switch">No account? <a onclick="switchModal('login','register')">Create one</a></div></div></div>

<div class="modal-overlay" id="registerModal"><div class="modal"><button class="modal-close" onclick="closeModal('register')">×</button><div class="modal-title">join typecraft</div><div class="modal-sub">unlock stats & history</div><div class="field"><label>Username</label><input id="regUsername"><div class="field-error" id="regUsernameErr"></div></div><div class="field"><label>Email</label><input id="regEmail"><div class="field-error" id="regEmailErr"></div></div><div class="field"><label>Password</label><input id="regPassword" type="password"><div class="field-error" id="regPassErr"></div></div><div class="field"><label>Confirm</label><input id="regPassword2" type="password"><div class="field-error" id="regPass2Err"></div></div><button class="primary-btn" onclick="doRegister()">Sign Up</button><div class="modal-switch">Existing? <a onclick="switchModal('register','login')">Log in</a></div></div></div>

<main>
  <div class="page active" id="testPage">
    <div class="mode-bar">
      <div class="mode-section"><button class="mode-btn" onclick="setModeOpt('punct')">⌨ punct</button><button class="mode-btn" onclick="setModeOpt('numbers')"># numbers</button></div>
      <div class="mode-divider"></div>
      <div class="mode-section"><button class="mode-btn active" data-mode="words" onclick="setTestMode('words')">words</button><button class="mode-btn" data-mode="time" onclick="setTestMode('time')">time</button><button class="mode-btn" data-mode="quote" onclick="setTestMode('quote')">quote</button><button class="mode-btn" data-mode="zen" onclick="setTestMode('zen')">zen</button></div>
      <div class="mode-divider"></div>
      <div class="mode-section" id="amountSection"><button class="mode-btn" data-amt="10" onclick="setAmountVal(10)">10</button><button class="mode-btn active" data-amt="25" onclick="setAmountVal(25)">25</button><button class="mode-btn" data-amt="50" onclick="setAmountVal(50)">50</button><button class="mode-btn" data-amt="100" onclick="setAmountVal(100)">100</button></div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-grid">
        <div class="settings-group"><label>Caret</label><div class="settings-options"><button class="settings-opt active" onclick="setCaretStyle('line')">line</button><button onclick="setCaretStyle('underline')">underline</button><button onclick="setCaretStyle('block')">block</button><button onclick="setCaretStyle('off')">off</button></div></div>
        <div class="settings-group"><label>Font size</label><div class="settings-options"><button onclick="setFontSizePref(20)">sm</button><button class="active" onclick="setFontSizePref(26)">md</button><button onclick="setFontSizePref(34)">lg</button></div></div>
        <div class="settings-group"><label>Stop on error</label><div class="settings-options"><button onclick="setStopOnErr(true)">on</button><button class="active" onclick="setStopOnErr(false)">off</button></div></div>
      </div>
    </div>

    <div id="testView"><div class="stats-row"><div class="stat-item" id="statWpm"><div class="stat-label">wpm</div><div class="stat-value">—</div></div><div class="stat-item" id="statAcc"><div class="stat-label">acc</div><div class="stat-value">—</div></div><div class="stat-item" id="statTime"><div class="stat-label">time</div><div class="stat-value">—</div></div></div><div class="progress-bar"><div class="progress-fill"></div></div><div class="typing-container"><div class="words-display" id="wordsDisplay" onclick="focusHiddenInput()"></div><input type="text" class="hidden-input" id="hiddenTypeInput" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div class="controls"><button class="restart-btn" onclick="restartTest()">⟳ restart <kbd>⌘/Tab</kbd></button></div></div>

    <div class="results-screen" id="resultsView"><div class="new-best-banner" id="bestBanner">🏆 new personal best!</div><div class="results-grid"><div class="result-card highlight"><div class="result-card-label">wpm</div><div class="result-card-value" id="finalWpm">—</div></div><div class="result-card"><div class="result-card-label">accuracy</div><div class="result-card-value" id="finalAcc">—</div></div><div class="result-card"><div class="result-card-label">characters</div><div class="result-card-value" id="finalChars">—</div></div></div><div class="controls"><button class="restart-btn" onclick="restartTest()">↻ try again</button><button class="restart-btn" onclick="navigateTo('profile')" style="color:var(--accent2)">→ profile</button></div></div>
  </div>

  <div class="page" id="profilePage"><div class="profile-page" id="profileContainer"></div></div>
</main>
<div class="toast" id="toastMsg"></div>
<footer>TypeCraft · <kbd>Tab</kbd> restart · data stored locally</footer>

<script src="script.js"></script>
</body>
</html>
